[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "@uniswap/v3-core/=lib/v3-core/",
    "@uniswap/v3-periphery/=lib/v3-periphery/"
]

[profile.default.fuzz]
runs = 1000

[rpc_endpoints]
hsk_testnet = "${RPC_TESTNET}"
hsk_mainnet = "${RPC_MAINNET_READONLY}"

[etherscan]
hsk_testnet = { key = "placeholder", url = "https://testnet-explorer.hsk.xyz/api" }
